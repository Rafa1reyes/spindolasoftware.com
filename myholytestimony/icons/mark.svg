<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff1c9"/><stop offset=".45" stop-color="#f4b555"/><stop offset="1" stop-color="#c58528"/>
  </linearGradient>
  <linearGradient id="leafL" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#3f8f4a"/><stop offset=".6" stop-color="#7cc765"/><stop offset="1" stop-color="#d3f2a4"/>
  </linearGradient>
  <linearGradient id="leafR" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#3f8f4a"/><stop offset=".6" stop-color="#7cc765"/><stop offset="1" stop-color="#d3f2a4"/>
  </linearGradient>
  <linearGradient id="seed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9b064"/><stop offset="1" stop-color="#8f5a1f"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset=".45" stop-color="#f4b555" stop-opacity=".18"/><stop offset="1" stop-color="#f4b555" stop-opacity="0"/>
  </radialGradient>
</defs>
<!--mark-->
<circle cx="256" cy="206" r="214" fill="url(#glow)"/>
<!-- soil line and the seed beneath it -->
<path d="M112 414 Q256 380 400 414" fill="none" stroke="#f4b555" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
<path d="M250 452 C244 470 232 478 218 482 M262 452 C268 470 280 478 294 482 M256 454 L256 486" fill="none" stroke="#c58528" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="256" cy="438" rx="27" ry="19" fill="url(#seed)"/>
<!-- stem -->
<path d="M256 424 L256 344" stroke="#4f9f52" stroke-width="13" stroke-linecap="round"/>
<!-- leaves -->
<path d="M256 362 C214 360 168 338 142 288 C196 280 246 306 256 362 Z" fill="url(#leafL)"/>
<path d="M256 362 C298 360 344 338 370 288 C316 280 266 306 256 362 Z" fill="url(#leafR)"/>
<path d="M250 354 C222 340 190 318 160 296 M262 354 C290 340 322 318 352 296" fill="none" stroke="#2f7a3c" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
<!-- the cross the seed grows into -->
<rect x="241" y="52" width="30" height="304" rx="11" fill="url(#gold)"/>
<rect x="166" y="130" width="180" height="30" rx="11" fill="url(#gold)"/>
<!--/mark-->
</svg>
